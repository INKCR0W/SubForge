mixed-port: 7890
mode: rule
log-level: info
dns:
  enable: true
  ipv6: false
proxies:
  - name: "发布页: v.yeshayun.com"
    type: ss
    server: pub.example.test
    port: 443
    cipher: aes-256-gcm
    password: redacted-fixture-password
    udp: true
  - name: "🇭🇰 香港 02"
    type: vmess
    server: hk2.example.test
    port: 443
    uuid: 22222222-2222-2222-2222-222222222222
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    servername: hk2.example.test
    ws-opts:
      path: /ws
      headers:
        Host: hk2.example.test
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - 自动选择
      - "发布页: v.yeshayun.com"
      - "🇭🇰 香港 02"
  - name: 自动选择
    type: url-test
    proxies:
      - "发布页: v.yeshayun.com"
      - "🇭🇰 香港 02"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
rules:
  - MATCH,🚀 节点选择
